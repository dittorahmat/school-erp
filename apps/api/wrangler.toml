name = "school-erp"
main = "src/index.ts"
compatibility_date = "2025-02-14"
compatibility_flags = ["nodejs_compat"]

[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "school-erp-db"
database_id = "93c65c0c-289e-405c-afda-737fa4a6219a"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "school-erp-storage"

[vars]
ENVIRONMENT = "production"
JWT_SECRET = "production-jwt-secret-school-erp-cloudflare-edge-secret"
